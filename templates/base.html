<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Performance Analyser{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Library for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Sleek Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark pb-3 pt-3 mb-4" style="background: rgba(18, 16, 35, 0.6); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="{{ url_for('index') }}">
                <i class="fa-solid fa-graduation-cap text-info"></i>
                <span class="header-accent text-white">Student Analytics Desk</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-expand navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path == '/' %}active fw-bold text-info{% endif %}" href="{{ url_for('index') }}">
                            <i class="fa-solid fa-house me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path == '/predict_form' %}active fw-bold text-info{% endif %}" href="{{ url_for('predict_form') }}">
                            <i class="fa-solid fa-wand-magic-sparkles me-1"></i>New Prediction
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path == '/history' %}active fw-bold text-info{% endif %}" href="{{ url_for('history') }}">
                            <i class="fa-solid fa-folder-open me-1"></i>Prediction History
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Wrapper -->
    <div class="container animated-fade-in">
        
        <!-- Flash messages (Alert Banners) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show border-0 shadow mb-4" role="alert" style="background: rgba(255, 255, 255, 0.08); color: var(--text-primary); border-left: 4px solid {% if category=='danger' %}var(--danger-neon){% else %}var(--accent-neon){% endif %};">
                        <i class="fa-solid fa-circle-exclamation me-2 text-info"></i>
                        {{ message }}
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Child Page Contents -->
        {% block content %}{% endblock %}

    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
